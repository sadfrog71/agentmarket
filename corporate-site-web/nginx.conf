server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name avatar-tech.com www.avatar-tech.com;
    return 301 https://www.avatar-tech.com$request_uri;
}

server {
    listen 80;
    server_name admin.avatar-tech.com;
    return 301 https://admin.avatar-tech.com$request_uri;
}

server {
    listen 80;
    server_name api.avatar-tech.com;
    return 301 https://api.avatar-tech.com$request_uri;
}

server {
    listen 443 ssl;
    server_name avatar-tech.com www.avatar-tech.com;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/nginx/tls/avatar-tech.com.pem;
    ssl_certificate_key /etc/nginx/tls/avatar-tech.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/nginx-site-routes.inc;
}

# The management UI is isolated from the public website origin.  It remains
# reachable only through this TLS gateway; the container's port stays local to
# the Docker network (and loopback for diagnostics).
server {
    listen 443 ssl;
    server_name admin.avatar-tech.com;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/nginx/tls/avatar-tech.com.pem;
    ssl_certificate_key /etc/nginx/tls/avatar-tech.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        set $admin_upstream admin;
        proxy_pass http://$admin_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# api is intentionally separate from admin.  It preserves the backend request
# path for authenticated integrations without publishing diagnostic endpoints.
server {
    listen 443 ssl;
    server_name api.avatar-tech.com;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/nginx/tls/avatar-tech.com.pem;
    ssl_certificate_key /etc/nginx/tls/avatar-tech.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/(?:swagger-ui(?:/|\.html)?|v3/api-docs(?:/|$)|druid(?:/|$)) {
        return 404;
    }

    location / {
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
