name: huayan-agent-marketplace

services:
  mysql:
    image: mysql:8.4
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ry-vue
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./agent-marketplace-backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ./agent-marketplace-backend/sql/marketplace.sql:/docker-entrypoint-initdb.d/02-marketplace.sql:ro
      - ./agent-marketplace-backend/sql/corporate-site.sql:/docker-entrypoint-initdb.d/03-corporate-site.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./agent-marketplace-backend
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUOYI_PROFILE: /opt/ruoyi/upload
      RUOYI_SITE_MEDIA_PATH: /opt/ruoyi/site-media
      # Bound the JVM in shared Docker Desktop environments instead of letting
      # its default percentage compete with other local project containers.
      RUOYI_JAVA_OPTS: ${RUOYI_JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - upload-data:/opt/ruoyi/upload
      - site-media-data:/opt/ruoyi/site-media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./agent-marketplace-web
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      - backend

  corporate-site:
    build: ./corporate-site-web
    ports:
      - "${CORPORATE_WEB_PORT:-8083}:80"
      - "${CORPORATE_WEB_HTTPS_PORT:-8443}:443"
    volumes:
      - ${CORPORATE_TLS_CERT_PATH:-./corporate-site-web/tls/avatar-tech.com.pem}:/etc/nginx/tls/avatar-tech.com.pem:ro
      - ${CORPORATE_TLS_KEY_PATH:-./corporate-site-web/tls/avatar-tech.com.key}:/etc/nginx/tls/avatar-tech.com.key:ro
    depends_on:
      - backend

  admin:
    build: ./agent-marketplace-admin
    ports:
      - "${ADMIN_BIND_HOST:-127.0.0.1}:${ADMIN_PORT:-8082}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  upload-data:
  site-media-data:
